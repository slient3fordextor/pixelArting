[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pixelarting-mcp"
dynamic = ["version"]
description = "Standalone local MCP server for PixelArting asset quality, versioning and export"
readme = "README.md"
requires-python = ">=3.12"
license = "AGPL-3.0-only"
dependencies = [
    "pydantic>=2.11,<3",
    "pillow>=11,<13",
    "numpy>=2,<3",
    "mcp>=1.30,<2",
    "keyring>=25,<26",
    "httpx>=0.27,<1",
    "pyjwt[crypto]>=2.10.1,<3",
]

[project.optional-dependencies]
desktop-api = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.20,<1", "httpx>=0.27,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1", "openapi-spec-validator>=0.7,<0.9"]

[project.scripts]
pixelarting-mcp = "backend.mcp_cli:main"

[tool.setuptools.packages.find]
include = ["backend"]
exclude = ["backend.tests*"]

[tool.setuptools.dynamic]
version = {attr = "backend._version.SERVICE_VERSION"}
